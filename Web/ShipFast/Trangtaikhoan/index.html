          <a class="btn btn-outline-light btn-sm me-2" href="../Trangdangky/index.html"><i class="bi bi-person-plus me-1"></i>Đăng ký</a>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="mb-0">Đơn của tôi</h1><a class="btn btn-primary" href="../Trangtaodon/index.html"><i class="bi bi-plus-lg me-1"></i>Tạo đơn</a></div>
    <div class="row g-3 mb-3" id="kpis"></div>
    <div class="row g-3">
      <div class="col-lg-8"><div class="card"><div class="table-responsive"><table class="table table-hover mb-0">
        <thead><tr><th>Mã</th><th>Đến</th><th>Phí</th><th>Trạng thái</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
      <div class="col-lg-4"><form class="card p-4" id="profileForm"><h5>Hồ sơ</h5>
        <label class="form-label" for="name">Họ và tên</label><input class="form-control" id="name" required>
        <label class="form-label mt-2" for="email">Email</label><input class="form-control" id="email" type="email" required>
        <label class="form-label mt-2" for="phone">Số điện thoại</label><input class="form-control" id="phone" pattern="0\d{9}" required>
        <label class="form-label mt-2" for="pass">Mật khẩu mới (bỏ trống nếu không đổi)</label><input class="form-control" id="pass" type="password" minlength="6">
        <button class="btn btn-primary mt-3 align-self-start">Lưu hồ sơ</button></form></div>
    </div>
  </main>
  <footer class="bg-dark text-secondary py-4 mt-5"><div class="container d-flex flex-wrap justify-content-between gap-2 small">
