<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yêu cầu hỗ trợ – ShipFast</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2317191E'/><path d='M7 21l9-12 9 12z' fill='%23FFC800'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:wght@600;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="adm">
    <aside>
      <a class="brand d-block px-2 mb-3" href="../Trangtongquan/index.html"><i class="bi bi-box-seam-fill"></i> ShipFast</a>
      <nav class="nav flex-column gap-1">
      <a class="animate__animated animate__fadeInLeft nav-link" style="--animate-delay:0.06s" href="../Trangtongquan/index.html"><i class="bi bi-speedometer2 me-1"></i>Tổng quan</a>
      <a class="animate__animated animate__fadeInLeft nav-link" style="--animate-delay:0.12s" href="../Trangdonhang/index.html"><i class="bi bi-boxes me-1"></i>Đơn hàng</a>
      <a class="animate__animated animate__fadeInLeft nav-link" style="--animate-delay:0.18s" href="../Trangsuco/index.html"><i class="bi bi-exclamation-triangle me-1"></i>Sự cố</a>
      <a class="animate__animated animate__fadeInLeft nav-link on" style="--animate-delay:0.24s" href="../Trangyeucau/index.html"><i class="bi bi-chat-dots me-1"></i>Yêu cầu hỗ trợ</a>
      <a class="animate__animated animate__fadeInLeft nav-link" style="--animate-delay:0.30s" href="../Tracuu/index.html"><i class="bi bi-globe me-1"></i>Xem trang khách</a>
      <a class="animate__animated animate__fadeInLeft nav-link" style="--animate-delay:0.36s" href="#" data-logout><i class="bi bi-box-arrow-left me-1"></i>Đăng xuất (<span data-user="user"></span>)</a>
      </nav>
    </aside>
    <main id="app">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2"><h2 class="mb-0 animate__animated animate__fadeInLeft">Yêu cầu hỗ trợ</h2></div>
      <div id="list"></div>
    </main>
  </div>
  <!-- Hộp thoại phản hồi (yeucau.js mở ra khi bấm nút "Phản hồi") -->
  <div class="modal fade" id="replyModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="replyForm">
        <div class="modal-header"><h5 class="modal-title">Phản hồi <span id="ticketId"></span></h5></div>
        <div class="modal-body"><textarea class="form-control" id="reply" rows="4" required></textarea></div>
        <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary">Gửi phản hồi</button></div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../Chung/data.js"></script>
  <script src="yeucau.js"></script>
</body>
</html>
