      <form class="tag-input" action="index.html" method="get">
        <input id="q" name="q" placeholder="SF123456780VN hoặc 0912345678" autocomplete="off" required aria-label="Mã vận đơn hoặc số điện thoại">
        <button class="btn btn-primary px-4"><i class="bi bi-search me-1"></i>Tra cứu</button>
      </form>
      <div class="mt-3 small text-secondary">Thử:
        <a class="chip" href="?q=SF123456787VN">Đang giao</a>
        <a class="chip" href="?q=SF123456785VN">Gặp sự cố</a>
        <a class="chip" href="?q=0912345678">Theo số điện thoại</a>
