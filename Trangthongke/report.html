<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Báo cáo & Thống kê - ShipFast</title>
  <link rel="stylesheet" href="report.css">
  <script src="../Chung/auth.js"></script>
</head>
<body data-page="report">
  <!-- Header: logo + lời chào -->
  

  <div class="layout">
    <!-- Sidebar: mục "Báo cáo & Thống kê" đang được chọn (class "active") -->
    

    <main class="content">
      <h1 class="ttl page-title"><span data-ic="chart-no-axes-combined" data-s="26"></span>Báo cáo &amp; Thống kê</h1>
      <!-- 1. Thanh bộ lọc (không có nút "Tạo đơn vận chuyển") -->
      <section class="card filters">
        <label><span class="lb"><span data-ic="chart-pie"></span>Loại báo cáo</span>
          <select id="periodType">
            <option value="day">Theo ngày</option>
            <option value="week">Theo tuần</option>
            <option value="month" selected>Theo tháng</option>
          </select>
        </label>
        <label><span class="lb"><span data-ic="calendar"></span>Thời gian</span> <input id="periodValue" type="month"></label>
        <label><span class="lb"><span data-ic="search"></span>Mã đơn</span> <input id="orderCode" type="text" placeholder="Nhập mã đơn..."></label>
        <label><span class="lb"><span data-ic="circle-check"></span>Trạng thái</span>
          <select id="statusFilter">
            <option value="all">Tất cả trạng thái</option>
            <option value="incident">Gặp sự cố</option>
            <option value="pending">Chờ lấy hàng</option>
            <option value="shipping">Đang giao hàng</option>
            <option value="delivered">Đã giao hàng</option>
          </select>
        </label>
        <button id="clearBtn" class="btn-outline" type="button">Xóa bộ lọc</button>
      </section>

      <p id="message" class="message" hidden></p>

      <!-- 2. Bốn thẻ thống kê -->
      <section class="stats" id="stats"></section>

      <!-- 3. Hai biểu đồ -->
      <section class="charts">
        <div class="card">
          <div class="card-head">
            <h2 id="barTitle">Tổng quan doanh thu</h2><span id="rangeLabel" class="muted"></span>
          </div>
          <div id="barChart" class="bar-chart"></div>
          <p id="chartInfo" class="muted chart-info"></p>
        </div>
        <div class="card">
          <h2>Tỷ lệ trạng thái đơn hàng</h2>
          <div class="donut-wrap">
            <div id="donut" class="donut">
              <div class="donut-hole"><small>Tổng</small><b id="donutTotal">0</b></div>
            </div>
            <ul id="legend" class="legend"></ul>
          </div>
        </div>
      </section>

      <!-- 4. Bảng danh sách đơn hàng -->
      <section class="card">
        <h2>Danh sách đơn hàng</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Mã đơn</th>
                <th>Khách hàng</th>
                <th>Khu vực</th>
                <th>Ngày tạo đơn</th>
                <th>Trạng thái</th>
                <th class="right">Doanh thu ghi nhận</th>
                <th>Dự kiến giao</th>
                <th>Nhân viên phụ trách</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="table-foot">
          <span id="tableInfo" class="muted"></span>
          <div class="pager">
            <button id="prevBtn" class="btn-outline" type="button">Trước</button>
            <span id="pageNo"></span>
            <button id="nextBtn" class="btn-outline" type="button">Sau</button>
          </div>
        </div>
        <p id="checkResult" class="muted small"></p>
      </section>
    </main>
  </div>

  <script src="report.js"></script>
</body>

</html>
