<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký – ShipFast</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2317191E'/><path d='M7 21l9-12 9 12z' fill='%23FFC800'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:wght@600;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sf-nav sticky-top">
    <div class="container">
      <a class="brand" href="../Tracuu/index.html"><i class="bi bi-box-seam-fill"></i> ShipFast</a>
      <button class="navbar-toggler border-secondary" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Mở menu"><i class="bi bi-list text-white"></i></button>
      <div class="collapse navbar-collapse" id="menu">
        <div class="navbar-nav me-auto">
          <a class="nav-link" href="../Tracuu/index.html"><i class="bi bi-search me-1"></i>Tra cứu</a>
          <a class="nav-link" data-show="customer" hidden href="../Trangtaodon/index.html"><i class="bi bi-plus-circle me-1"></i>Tạo đơn</a>
          <a class="nav-link" href="../Tranghotro/index.html"><i class="bi bi-headset me-1"></i>Hỗ trợ</a>
          <a class="nav-link" data-show="customer" hidden href="../Trangtaikhoan/index.html"><i class="bi bi-boxes me-1"></i>Đơn của tôi</a>
        </div>
        <span data-show="guest">
          <a class="btn btn-outline-light btn-sm me-2" href="../Trangdangky/index.html"><i class="bi bi-person-plus me-1"></i>Đăng ký</a>
          <a class="btn btn-primary btn-sm" href="../Trangdangnhap/index.html"><i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập</a>
        </span>
        <a class="btn btn-primary btn-sm me-2" data-show="admin" hidden href="../Trangtongquan/index.html"><i class="bi bi-speedometer2 me-1"></i>Trang quản trị</a>
        <span class="text-white small me-3" data-show="customer" hidden><i class="bi bi-person-circle me-1"></i><span data-user="name"></span></span>
        <button class="btn btn-outline-light btn-sm" data-show="customer admin" hidden data-logout><i class="bi bi-box-arrow-left me-1"></i>Đăng xuất</button>
      </div>
    </div>
  </nav>
  <main class="container py-5 w-460">
    <form id="registerForm" class="card p-4">
      <h2><i class="bi bi-person-plus me-2"></i>Đăng ký khách hàng</h2>
      <input class="form-control mt-3" id="name" placeholder="Họ và tên" required>
      <input class="form-control mt-2" id="username" placeholder="Tên tài khoản" autocomplete="username" required>
      <input class="form-control mt-2" id="email" type="email" placeholder="Email" required>
      <input class="form-control mt-2" id="phone" placeholder="Số điện thoại" pattern="0\d{9}" title="10 số, bắt đầu bằng 0" required>
      <input class="form-control mt-2" id="pass" type="password" placeholder="Mật khẩu (từ 6 ký tự)" minlength="6" autocomplete="new-password" required>
      <div class="text-danger small mt-2" id="error" role="alert"></div>
      <button class="btn btn-primary mt-2">Tạo tài khoản</button>
      <a class="small mt-3" href="../Trangdangnhap/index.html">Đã có tài khoản? Đăng nhập</a>
    </form>
  </main>
  <footer class="bg-dark text-secondary py-4 mt-5"><div class="container d-flex flex-wrap justify-content-between gap-2 small">
    <span>© 2026 ShipFast · Giao nhận, niềm tin vững</span>
    <span><i class="bi bi-telephone me-1"></i>1900 1234 <i class="bi bi-envelope ms-2 me-1"></i>hotro@shipfast.vn <i class="bi bi-clock ms-2 me-1"></i>07:00–21:00</span>
  </div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../Chung/data.js"></script>
  <script src="../Chung/animate.js"></script>
  <script src="register.js"></script>
</body>
</html>
