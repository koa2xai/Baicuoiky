<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập – ShipFast</title>
    <script src="../Chung/auth.js"></script>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f5f7fb;
            color: #0b2a4a;
            font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
            padding: 16px
        }

        .box {
            width: 100%;
            max-width: 360px;
            background: #fff;
            border-radius: 11px;
            box-shadow: 0 1px 4px #0b2a4a14;
            overflow: hidden
        }

        .hd {
            background: #0a2a4a;
            color: #fff;
            padding: 18px 22px
        }

        .hd b {
            font-size: 22px;
            display: block
        }

        .hd small {
            opacity: .8;
            font-size: 11px
        }

        form {
            padding: 22px;
            display: grid;
            gap: 12px
        }

        label {
            display: grid;
            gap: 5px;
            font-size: 12px;
            font-weight: 600
        }

        input {
            border: 1px solid #e3e9f0;
            border-radius: 6px;
            padding: 9px 10px;
            font: inherit
        }

        button {
            border: 1px solid #0a87a8;
            background: #0a87a8;
            color: #fff;
            border-radius: 6px;
            padding: 10px;
            font: 600 13px inherit;
            cursor: pointer
        }

        .err {
            color: #c0392b;
            font-size: 12px;
            min-height: 16px
        }

        .hint {
            font-size: 11px;
            color: #5f7388
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="hd"><b>ShipFast</b><small>Giao nhận, niềm tin vững</small></div>
        <form id="f"><label>Tên tài khoản<input id="u" autocomplete="username" required autofocus></label>
            <label>Mật khẩu<input id="p" type="password" autocomplete="current-password" required></label>
            <div class="err" id="e" role="alert"></div><button>Đăng nhập</button>
            <div class="hint">Đăng nhập demo phía trình duyệt: admin / admin123</div>
        </form>
    </div>
    <script>
        if (SFAuth.get()) location.replace("../Trangsuco/incident.html");
        document.getElementById("f").onsubmit = function (ev) {
            ev.preventDefault();
            if (SFAuth.login(document.getElementById("u").value, document.getElementById("p").value)) location.replace("../Trangsuco/incident.html");
            else document.getElementById("e").textContent = "Sai tên tài khoản hoặc mật khẩu."
        };
    </script>
</body>

</html>
