    </div>

  <main class="container py-4 w-720">
    <h1 class="mb-1">Tạo đơn mới</h1>
    <p class="text-body-secondary">Đơn sau khi tạo sẽ được lưu vào mục “Đơn của tôi”.</p>
    <form id="orderForm" class="card p-4">
      <div class="row g-2">
        <div class="col-12"><label class="form-label" for="from">Giao từ — địa chỉ lấy hàng (tỉnh/thành)</label><input class="form-control" id="from" list="cities" placeholder="VD: TP. Hồ Chí Minh" required></div>
        <div class="col-12"><label class="form-label" for="address">Giao đến — địa chỉ nhận (tỉnh/thành)</label><input class="form-control" id="address" list="cities" placeholder="VD: Hà Nội" required></div>
        <datalist id="cities"><option value="Hà Nội"><option value="TP. Hồ Chí Minh"><option value="Đà Nẵng"><option value="Hải Phòng"><option value="Cần Thơ"><option value="Huế"><option value="Nha Trang"><option value="Đà Lạt"><option value="Vũng Tàu"><option value="Quy Nhơn"><option value="Vinh"></datalist>
        <div class="col-md-6"><label class="form-label" for="pickupDate">Ngày shipper đến lấy hàng</label><input class="form-control" id="pickupDate" type="date" required></div>
        <div class="col-md-6"><label class="form-label" for="pickupSlot">Khung giờ lấy hàng</label><select class="form-select" id="pickupSlot" required></select></div>
        <div class="col-12"><div class="small text-body-secondary" id="pickupHint"></div></div>
        <div class="col-md-6"><label class="form-label" for="receiver">Người nhận</label><input class="form-control" id="receiver" required></div>
        <div class="col-md-6"><label class="form-label" for="phone">Số điện thoại</label><input class="form-control" id="phone" pattern="0\d{9}" title="10 số, bắt đầu bằng 0" required></div>
        <div class="col-md-5"><label class="form-label" for="service">Dịch vụ</label><select class="form-select" id="service"></select></div>
        <div class="col-md-3"><label class="form-label" for="kg">Khối lượng (kg)</label><input class="form-control" id="kg" type="number" min="0.5" step="0.5" value="1" required></div>
        <div class="col-md-4"><label class="form-label" for="cod">Thu hộ COD (₫)</label><input class="form-control" id="cod" type="number" min="0" step="1000" value="0"></div>
      </div>
      <div class="alert alert-warning my-3 d-flex justify-content-between"><span><i class="bi bi-receipt me-1"></i>Phí vận chuyển tạm tính</span><b id="fee"></b></div>
      <button class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Đặt đơn</button>
    </form>
  </main>
  <footer class="bg-dark text-secondary py-4 mt-5"><div class="container d-flex flex-wrap justify-content-between gap-2 small">

  </div></footer>

</body>
